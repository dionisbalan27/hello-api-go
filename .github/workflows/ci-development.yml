name: ci-development

on:
  push:
    branches: [ci/development]
  pull_request:
    branches: [ci/development]

env:
  APP_NAME: hello-api-go
  ENVIRONMENT: dev
  AZURE_RESOURCE_GROUP: rg-hello-api-go-dev
  SERVICE_PORT: "3000"
  READINESS_PATH: /health

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  preflight:
    runs-on: ubuntu-latest
    outputs:
      azure_ready: ${{ steps.check.outputs.azure_ready }}
    steps:
      - id: check
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ]; then
            echo "azure_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "azure_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret AZURE_* belum diisi; job infra, build-push dan deploy dilewati."
          fi

  infra:
    needs: [test, preflight]
    if: github.event_name == 'push' && needs.preflight.outputs.azure_ready == 'true'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    outputs:
      acr_login_server: ${{ steps.deploy.outputs.acr_login_server }}
      container_app: ${{ steps.deploy.outputs.container_app }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        id: deploy
        run: |
          # Image yang sedang jalan dipertahankan agar deploy infra tidak mengembalikan app ke image quickstart.
          CURRENT_IMAGE=$(az containerapp show --name "$APP_NAME-$ENVIRONMENT" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          PARAMS="environmentName=$ENVIRONMENT appName=$APP_NAME targetPort=$SERVICE_PORT"
          if [ -n "$CURRENT_IMAGE" ]; then PARAMS="$PARAMS containerImage=$CURRENT_IMAGE"; fi
          az deployment group create \
            --name "infra-${GITHUB_SHA::8}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters $PARAMS \
            --query properties.outputs -o json > outputs.json
          echo "acr_login_server=$(jq -r .acrLoginServer.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "container_app=$(jq -r .containerAppName.value outputs.json)" >> "$GITHUB_OUTPUT"
          echo "app_url=$(jq -r .appUrl.value outputs.json)" >> "$GITHUB_OUTPUT"

  build-push:
    needs: infra
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Login to ACR
        run: az acr login --name "${{ needs.infra.outputs.acr_login_server }}"
      - id: meta
        run: echo "image=${{ needs.infra.outputs.acr_login_server }}/$APP_NAME:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ needs.infra.outputs.acr_login_server }}/${{ env.APP_NAME }}:development
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [infra, build-push]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update Container App
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          CONTAINER_APP: ${{ needs.infra.outputs.container_app }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --revision-suffix "${GITHUB_SHA::8}" \
            --output none
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "deployed $IMAGE -> https://$FQDN"
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- url: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        env:
          CONTAINER_APP: ${{ needs.infra.outputs.container_app }}
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://$FQDN$READINESS_PATH"
          curl -fsS "https://$FQDN/"
